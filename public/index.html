<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CL Vault Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f6f8; --rule:#dfe4ea; --rule-2:#ebeef2;
  --ink:#12161c; --ink-2:#414a55; --muted:#6b7480;
  --accent:#0f6d80; --on-accent:#ffffff;
  --up:#0f7a4d; --down:#b23b2b; --warn-bg:#fff6e0; --warn-ink:#6b4e00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#a86ad6;
  --price:#5b6572; --band-a:0.10; --grid:#e6eaee; --crosshair:#9aa4b0;
  --shadow:0 1px 2px rgba(18,22,28,.05),0 10px 30px -16px rgba(18,22,28,.2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e12; --surface:#141a20; --surface-2:#1a212a; --rule:#28313b; --rule-2:#212a33;
  --ink:#e9edf1; --ink-2:#bcc6d0; --muted:#8592a0; --accent:#3fb6c9; --on-accent:#06222a;
  --up:#5fc292; --down:#e5897d; --warn-bg:#2b2410; --warn-ink:#e8cf8a;
  --s1:#3987e5; --s2:#e0703f; --s3:#22b583; --s4:#b384e6;
  --price:#8c96a3; --band-a:0.17; --grid:#232c35; --crosshair:#5b6675;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0b0e12; --surface:#141a20; --surface-2:#1a212a; --rule:#28313b; --rule-2:#212a33;
  --ink:#e9edf1; --ink-2:#bcc6d0; --muted:#8592a0; --accent:#3fb6c9; --on-accent:#06222a;
  --up:#5fc292; --down:#e5897d; --warn-bg:#2b2410; --warn-ink:#e8cf8a;
  --s1:#3987e5; --s2:#e0703f; --s3:#22b583; --s4:#b384e6;
  --price:#8c96a3; --band-a:0.17; --grid:#232c35; --crosshair:#5b6675;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:72rem;margin:0 auto;padding:2rem 1.2rem 5rem}
@media (max-width:640px){.wrap{padding:1.2rem 1rem 4rem}}
.mono{font-family:"IBM Plex Mono",monospace} h1,h2,h3{font-family:"Archivo",sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;border-bottom:1px solid var(--rule);padding-bottom:1.2rem;margin-bottom:1rem}
.eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 .4rem}
h1{font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0;font-weight:800;letter-spacing:-.02em}
.hstats{display:flex;align-items:flex-end;gap:1.2rem;flex-wrap:wrap}
.gen{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);text-align:right;line-height:1.45}
.tvl{text-align:right}
.tvl .n{font-family:"Archivo",sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tvl .l{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.status{background:var(--warn-bg);color:var(--warn-ink);border-radius:.45rem;padding:.55rem .8rem;font-size:.8rem;margin:0 0 1rem;line-height:1.5}
.pairs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.pill{font:500 .83rem "IBM Plex Sans",sans-serif;padding:.4rem .8rem;border-radius:.45rem;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:border-color .12s,color .12s}
.pill:hover{border-color:var(--accent);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.zoombar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:0 0 1.1rem}
.zl{color:var(--muted);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.zpills,.toggles{display:flex;gap:.3rem;flex-wrap:wrap}
.zhint{color:var(--muted);font-size:.74rem;margin-left:auto}
@media (max-width:640px){.zhint{display:none}}
.tg{font:400 .74rem "IBM Plex Sans",sans-serif;padding:.3rem .55rem;border-radius:.35rem;border:1px solid var(--rule);background:var(--surface-2);color:var(--muted);cursor:pointer}
.tg:hover{color:var(--ink)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.6rem;margin-bottom:1.3rem}
.mcard{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--arm);border-radius:.5rem;padding:.75rem .85rem;box-shadow:var(--shadow);min-width:0}
.mcard .arm{font-size:.8rem;color:var(--ink);font-weight:600;margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.mcard .tag{font:500 .66rem "IBM Plex Mono",monospace;color:var(--muted);border:1px solid var(--rule);border-radius:.25rem;padding:.05rem .3rem}
.dot{width:.62rem;height:.62rem;border-radius:.15rem;background:var(--arm);flex:none}
.big{font-family:"Archivo",sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.up{color:var(--up)} .down{color:var(--down)}
.bigsub{font-size:.72rem;color:var(--muted);margin:.25rem 0 .55rem}
.bigsub b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.18rem .7rem;font-size:.74rem;line-height:1.35}
.kv .k{color:var(--muted)} .kv .v{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--rule-2);margin:.2rem 0}
.chartcard{background:var(--surface);border:1px solid var(--rule);border-radius:.6rem;padding:1rem 1.1rem 1.1rem;margin-bottom:1.1rem;box-shadow:var(--shadow);min-width:0}
@media (max-width:640px){.chartcard{padding:.85rem .7rem .9rem}}
.chead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.6rem;margin-bottom:.25rem}
.chead h3{font-size:1rem;margin:0;font-weight:700;letter-spacing:-.01em}
.hint{font-size:.77rem;color:var(--muted);line-height:1.45;margin-top:.15rem}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin:.55rem 0 .3rem;font-size:.77rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem;color:var(--ink-2)}
.legend .sw{width:.85rem;height:.28rem;border-radius:.14rem;background:var(--c)}
.legend .sw.dash{background:none;border-top:2px dashed var(--c);height:0;width:1.1rem;border-radius:0}
.legend .sw.box{height:.6rem;width:.85rem;opacity:.5}
.legend .apr{color:var(--muted)}
.plot{position:relative;touch-action:pan-y}
svg{display:block;overflow:visible}
.axis{font:10.5px "IBM Plex Mono",monospace;fill:var(--muted)}
.gridline{stroke:var(--grid);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:.4rem;padding:.5rem .6rem;font-size:.75rem;box-shadow:var(--shadow);z-index:20;opacity:0;transition:opacity .08s;min-width:11rem;max-width:17rem}
.tip .t-date{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:.68rem;margin-bottom:.3rem}
.tip .t-row{display:flex;justify-content:space-between;gap:.9rem;font-variant-numeric:tabular-nums}
.tip .t-row .k{display:inline-flex;align-items:center;gap:.3rem;color:var(--ink-2);min-width:0}
.tip .t-row .k .sw{width:.55rem;height:.55rem;border-radius:.12rem;background:var(--c);flex:none}
.tip .t-row .v{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500;white-space:nowrap}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--muted);font-size:.88rem}
.etable{max-height:22rem;overflow:auto;border:1px solid var(--rule);border-radius:.45rem}
.etable table{width:100%;border-collapse:collapse;font-size:.79rem}
.etable th{position:sticky;top:0;background:var(--surface-2);text-align:right;padding:.45rem .6rem;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);white-space:nowrap}
.etable th:nth-child(-n+3),.etable td:nth-child(-n+3){text-align:left}
.etable td{padding:.36rem .6rem;text-align:right;border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.etable tr:last-child td{border-bottom:none}
.armdot{width:.55rem;height:.55rem;border-radius:.12rem;display:inline-block;margin-right:.3rem;vertical-align:-1px}
.pos{color:var(--up)} .neg{color:var(--down)} .mut{color:var(--muted)}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);color:var(--muted);font-size:.78rem;line-height:1.65}
footer p{margin:0 0 .6rem} footer b{color:var(--ink-2);font-weight:600}
.loading{padding:5rem 1rem;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <p class="eyebrow">Aerodrome Slipstream &middot; Base</p>
    <h1>CL Vault Monitor</h1>
  </div>
  <div class="hstats">
    <div class="tvl"><span class="n" id="tvl">&ndash;</span><span class="l" id="tvl-l">total TVL</span></div>
    <div class="gen" id="gen"></div>
    <button class="tg" id="theme" type="button" title="Switch light / dark">Theme: auto</button>
  </div>
</header>
<div class="status" id="status" hidden></div>
<div id="app"><div class="loading" id="loading">Loading&hellip;</div></div>
<template id="tpl">
<div class="pairs" id="pairs" role="group" aria-label="Pool"></div>
<div class="zoombar">
  <span class="zl">Timeframe</span>
  <div class="zpills" id="zpresets"></div>
  <span class="zhint">pinch or &#8984;/ctrl + scroll to zoom &middot; drag to pan &middot; double-click to reset</span>
</div>
<div class="metrics" id="metrics"></div>

<section class="chartcard">
  <div class="chead"><div><h3>Price and ranges</h3><div class="hint" id="price-hint"></div></div></div>
  <div class="legend" id="price-legend"></div>
  <div class="plot" id="price-chart"></div>
</section>

<section class="chartcard">
  <div class="chead">
    <div><h3>Performance</h3><div class="hint" id="perf-hint"></div></div>
    <div class="toggles" id="measures"></div>
  </div>
  <div class="legend" id="perf-legend"></div>
  <div class="plot" id="perf-chart"></div>
</section>

<section class="chartcard">
  <div class="chead">
    <div><h3>Income and cost</h3><div class="hint" id="econ-hint"></div></div>
    <div class="toggles" id="econs"></div>
  </div>
  <div class="legend" id="econ-legend"></div>
  <div class="plot" id="econ-chart"></div>
</section>

<section class="chartcard">
  <div class="chead"><div><h3>Events</h3><div class="hint" id="events-hint"></div></div></div>
  <div id="events-table"></div>
</section>
<footer id="foot"></footer>
</template>
</div>
<div class="tip" id="tip"></div>

<script src="/metrics.js"></script>
<script>
"use strict";
const M = window.CLMetrics;
const COLORS = ['--s1', '--s2', '--s3', '--s4'];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const DAY = 86400;

// ---------------------------------------------------------------------------------------- state
const st = { view: null, groups: [], byKey: {}, cur: null, measure: 'hold', econ: 'net', preset: null, viewT0: null, viewT1: null, full: [0, 0], theme: 'auto' };
function save() { try { localStorage.setItem('cldash2', JSON.stringify({ cur: st.cur, measure: st.measure, econ: st.econ, preset: st.preset, viewT0: st.preset == null ? st.viewT0 : null, viewT1: st.preset == null ? st.viewT1 : null, theme: st.theme })); } catch (e) {} }
function restore() { try { const s = JSON.parse(localStorage.getItem('cldash2') || '{}'); Object.assign(st, { cur: s.cur || null, measure: s.measure || 'hold', econ: s.econ || 'net', preset: s.preset != null ? s.preset : null, viewT0: s.viewT0 != null ? s.viewT0 : null, viewT1: s.viewT1 != null ? s.viewT1 : null, theme: s.theme || 'auto' }); } catch (e) {} }
restore();
applyTheme();

// ---------------------------------------------------------------------------------------- formatting
const pct = (x, d = 2) => x == null || !isFinite(x) ? '&ndash;' : (x >= 0 ? '+' : '&minus;') + Math.abs(x).toFixed(d) + '%';
const cls = x => x == null ? 'mut' : x >= 0 ? 'up' : 'down';
const fmtNum = (x, d) => x == null ? '&ndash;' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const pxDec = p => p >= 1000 ? 0 : p >= 100 ? 2 : p >= 1 ? 4 : 6;
const utc = t => new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ');
const days = d => d >= 10 ? d.toFixed(0) + ' d' : d >= 1 ? d.toFixed(1) + ' d' : (d * 24).toFixed(0) + ' h';
const aprTxt = x => x == null || !isFinite(x) ? '' : (x >= 0 ? '+' : '&minus;') + (Math.abs(x) >= 100 ? Math.abs(x).toFixed(0) : Math.abs(x).toFixed(1)) + '% a year';
const KIND = { r: '&#9650; rebalance', h: '&#9670; harvest', enter: '&#9679; entered the pool', exit: '&#9675; left the pool', replace: '&#9650; moved range', rebalance: '&#9650; rebalance' };

// ---------------------------------------------------------------------------------------- data
async function load(first) {
  let r;
  try { r = await fetch('/api/view', { cache: 'no-store' }); } catch (e) { return retry('Could not reach the server; retrying.'); }
  if (r.status === 503) { const j = await r.json().catch(() => ({})); return retry('Collecting on-chain data for the first time. This page loads by itself when it is ready.' + (j.lastError ? ' Last error: ' + String(j.lastError).slice(0, 160) : '')); }
  if (!r.ok) return retry('The server answered ' + r.status + '; retrying.');
  const v = await r.json();
  st.view = v;
  st.groups = groupArms(v);
  if (first) mount();
  if (!st.cur || !st.byKey[st.cur]) st.cur = st.groups.length ? (st.groups.find(g => g.name === 'USDC/NVDAc') || st.groups[0]).key : null;
  renderAll();
}
function retry(msg) { const l = $('loading'); if (l) l.textContent = msg; setTimeout(() => load(!$('pairs')), 8000); }

function groupArms(v) {
  const g = {};
  v.vaults.forEach(raw => {
    const a = M.decode(raw);
    if (!a.t.length) return;
    a.price = i => M.price(a, i);
    const k = a.pool || a.pair;
    (g[k] = g[k] || { key: k, arms: [], sym0: a.sym0, sym1: a.sym1, d0: a.d0, d1: a.d1, spacing: a.spacing }).arms.push(a);
  });
  const list = Object.values(g);
  const nameCount = {};
  list.forEach(x => { x.name = x.sym0 + '/' + x.sym1; nameCount[x.name] = (nameCount[x.name] || 0) + 1; });
  list.forEach(x => {
    if (nameCount[x.name] > 1 && x.spacing) x.name += ' · CL' + x.spacing;
    x.arms.sort((p, q) => (p.widthTicks || 0) - (q.widthTicks || 0) || String(p.label).localeCompare(String(q.label)));
    x.arms.forEach((a, i) => { a.color = COLORS[i % COLORS.length]; a.name = armName(a); });
  });
  list.sort((p, q) => p.name.localeCompare(q.name));
  st.byKey = {}; list.forEach(x => { st.byKey[x.key] = x; });
  return list;
}
function armName(a) {
  if (a.label) return a.label;
  return a.widthPct != null ? a.widthPct.toFixed(2) + '%' : a.id;
}
const designTag = a => a.design;

// ---------------------------------------------------------------------------------------- page skeleton
const ZOOM = [['1d', DAY], ['1wk', 7 * DAY], ['1mo', 30 * DAY], ['3mo', 90 * DAY], ['All', null]];
const MEASURES = [['hold', 'vs holding 50/50'], ['marked', 'Marked'], ['booked', 'Share price'], ['t0', 'In token0'], ['t1', 'In token1']];
const ECONS = [['net', 'Net'], ['aero', 'AERO'], ['fee', 'Swap fees'], ['lend', 'Lending'], ['cost', 'Cost at rebalances']];
function mount() {
  const app = $('app');
  app.innerHTML = '';
  app.appendChild($('tpl').content.cloneNode(true));
  ZOOM.forEach(([label, win]) => btn($('zpresets'), label, () => setPreset(win), b => { b.dataset.win = win == null ? 'all' : win; }));
  MEASURES.forEach(([k, label]) => btn($('measures'), label, () => { st.measure = k; renderAll(); }, b => { b.dataset.k = k; }));
  ECONS.forEach(([k, label]) => btn($('econs'), label, () => { st.econ = k; renderAll(); }, b => { b.dataset.k = k; }));
  window.addEventListener('resize', debounce(() => renderCharts(), 150));
}
function btn(host, label, onclick, more) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tg'; b.textContent = label; b.onclick = onclick; if (more) more(b); host.appendChild(b); return b; }
function debounce(f, ms) { let t; return () => { clearTimeout(t); t = setTimeout(f, ms); }; }

// ---------------------------------------------------------------------------------------- window
function curGroup() { return st.byKey[st.cur] || null; }
function fullDomain(arms) { let a = Infinity, b = -Infinity; arms.forEach(x => { a = Math.min(a, x.t[0]); b = Math.max(b, x.t[x.t.length - 1]); }); return [a, b]; }
function windowNow() {
  const [f0, f1] = st.full;
  if (st.preset != null) return [Math.max(f0, f1 - st.preset), f1];
  if (st.viewT0 != null && st.viewT1 != null) return [Math.max(f0, st.viewT0), Math.min(f1, st.viewT1)];
  return [f0, f1];
}
function setPreset(win) { st.preset = win; st.viewT0 = st.viewT1 = null; scheduleRender(true); }
function setView(a, b, keepSpan) {
  const [f0, f1] = st.full; const full = f1 - f0 || 1;
  if (!keepSpan) { const minS = Math.max(full / 600, 3 * 3600); let span = Math.min(Math.max(b - a, minS), full); const c = (a + b) / 2; a = c - span / 2; b = c + span / 2; }
  const span = b - a; if (a < f0) { a = f0; b = f0 + span; } if (b > f1) { b = f1; a = f1 - span; }
  a = Math.max(a, f0); b = Math.min(b, f1);
  st.preset = null;
  if (a <= f0 + 1 && b >= f1 - 1) { st.viewT0 = st.viewT1 = null; } else { st.viewT0 = a; st.viewT1 = b; }
  scheduleRender(true);
}
let raf = false, rafAll = false;
function scheduleRender(all) { rafAll = rafAll || all; if (raf) return; raf = true; requestAnimationFrame(() => { raf = false; const a = rafAll; rafAll = false; if (a) renderAll(); else renderCharts(); }); }

// ---------------------------------------------------------------------------------------- render
function renderAll() {
  const v = st.view; if (!v) return;
  const g = curGroup();
  renderHeader();
  const pairs = $('pairs'); pairs.innerHTML = '';
  st.groups.forEach(x => { const b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.textContent = x.name; b.setAttribute('aria-pressed', x.key === st.cur); b.onclick = () => { st.cur = x.key; st.preset = null; st.viewT0 = st.viewT1 = null; renderAll(); }; pairs.appendChild(b); });
  if (!g) { $('metrics').innerHTML = '<div class="empty">No vault has data yet.</div>'; return; }
  st.full = fullDomain(g.arms);
  const hasLend = g.arms.some(a => a.lend);
  if (st.econ === 'lend' && !hasLend) st.econ = 'net';
  document.querySelectorAll('#econs .tg').forEach(b => { b.hidden = b.dataset.k === 'lend' && !hasLend; b.setAttribute('aria-pressed', b.dataset.k === st.econ); });
  document.querySelectorAll('#measures .tg').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.k === st.measure);
    if (b.dataset.k === 't0') b.textContent = 'In ' + g.sym0; if (b.dataset.k === 't1') b.textContent = 'In ' + g.sym1;
  });
  renderCards(g); renderCharts(); renderTable(g); renderFoot(g); syncZoom(); save();
}
function syncZoom() { const [f0, f1] = st.full; const [t0, t1] = windowNow(); const cur = st.preset != null ? String(st.preset) : (t0 <= f0 + 1 && t1 >= f1 - 1 ? 'all' : ''); document.querySelectorAll('#zpresets .tg').forEach(b => b.setAttribute('aria-pressed', b.dataset.win === cur)); }
function renderCharts() { const g = curGroup(); if (!g) return; renderPrice(g); renderPerf(g); renderEcon(g); }

function renderHeader() {
  const v = st.view;
  $('gen').innerHTML = 'block ' + v.generatedAtBlock.toLocaleString('en-US') + '<br>' + utc(v.generatedAtTs) + ' UTC';
  const priced = v.vaults.filter(x => x.tvlUsd != null); const tvl = priced.reduce((s, x) => s + x.tvlUsd, 0);
  $('tvl').textContent = '$' + tvl.toLocaleString('en-US', { maximumFractionDigits: 0 });
  $('tvl-l').innerHTML = 'total TVL &middot; ' + priced.length + ' vaults' + (v.vaults.length > priced.length ? ' (+' + (v.vaults.length - priced.length) + ' unpriced)' : '');
  const s = $('status'); const p = v.progress;
  let msg = '';
  if (v.legacy) msg = 'Showing the earlier build’s samples (sparse in the early weeks) until the first refresh of this build finishes, in a few minutes.';

    if (measure === 'hold') y = (L / (0.5 + 0.5 * r) - 1) * 100;
    else if (measure === 'marked') y = (L / Math.sqrt(r) - 1) * 100;
    else if (measure === 'booked') y = ppsB > 0 && a.pps[i] > 0 ? (a.pps[i] / ppsB - 1) * 100 : null;
    else if (measure === 't0') y = (L - 1) * 100;
    else y = (L / r - 1) * 100;
    pts.push({ t: a.t[i], y });
  }
  return pts;
}
function renderPerf(g) {
  const host = $('perf-chart'), leg = $('perf-legend');
  const [t0, t1] = windowNow();
  const series = g.arms.map(a => { const pts = perfSeries(a, t0, st.measure) || []; return { a, pts, ts: pts.map(p => p.t) }; });
  let refs = [];
  if (st.measure === 'hold') {
    // holding only one of the two tokens, against holding 50/50, from the earliest start in view
    const P = poolPrice(g).filter(p => p.grid && p.t >= t0);
    if (P.length) { const pB = P[0].y; const one = (k, fn) => ({ label: k, pts: P.map(p => { const r = p.y / pB, H = 0.5 + 0.5 * r; return { t: p.t, y: fn(r, H) }; }) });
      refs = [Object.assign(one('holding only ' + g.sym0, (r, H) => (1 / H - 1) * 100), { color: cssv('--muted'), dash: '2 3' }),
              Object.assign(one('holding only ' + g.sym1, (r, H) => (r / H - 1) * 100), { color: cssv('--price'), dash: '6 4' })]; }
  }
  let lo = Infinity, hi = -Infinity;
  const fold = pts => { let lastBefore = null; for (const p of pts) { if (p.y == null) continue; if (p.t >= t0 && p.t <= t1) { lo = Math.min(lo, p.y); hi = Math.max(hi, p.y); } else if (p.t > t1) { lo = Math.min(lo, p.y); hi = Math.max(hi, p.y); break; } } };
  series.forEach(s => fold(s.pts)); refs.forEach(r => fold(r.pts));
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  lo = Math.min(lo, 0); hi = Math.max(hi, 0);
  const pad = (hi - lo) * 0.08 || 0.5; lo -= pad; hi += pad;
  const dec = hi - lo < 0.5 ? 3 : hi - lo < 5 ? 2 : 1;
  const f = frame(host, t0, t1, lo, hi, { zeroLine: true, yfmt: v => (v > 0 ? '+' : '') + v.toFixed(dec) + '%' });
  refs.forEach(r => { r.ts = r.pts.map(p => p.t); drawLine(f, r.pts, r.color, { width: 1.1, dash: r.dash, opacity: .55, noGaps: true }); });
  series.forEach(s => { drawLine(f, s.pts, cssv(s.a.color)); const last = [...s.pts].reverse().find(p => p.y != null && p.t <= t1); if (last) f.svg.appendChild(mk('circle', { cx: f.X(last.t), cy: f.Y(last.y), r: 3, fill: cssv(s.a.color), 'clip-path': f.clip })); });
  interact(f, t => {
    let rows = '';
    series.forEach(s => { if (!s.pts.length || t < s.pts[0].t) return; const i = nearest(s.ts, t); const y = s.pts[i].y; rows += trow(cssv(s.a.color), s.a.name, y == null ? '&ndash;' : pct(y)); });
    refs.forEach(r => { if (!r.pts.length) return; const i = nearest(r.ts, t); rows += trow(r.color, r.label, pct(r.pts[i].y)); });
    return rows;
  });
  const end = s => { const p = [...s.pts].reverse().find(p => p.y != null && p.t <= t1); return p ? ` <span class="apr">${pct(p.y)}</span>` : ''; };
  leg.innerHTML = series.map(s => `<span style="--c:${cssv(s.a.color)}"><span class="sw"></span>${s.a.name}${st.measure === 'booked' && s.a.ppsUnit !== 'L' ? ' (in ' + g.sym0 + ')' : ''}${end(s)}</span>`).join('')
    + refs.map(r => `<span style="--c:${r.color}"><span class="sw dash"></span>${r.label}</span>`).join('');
  const H = {
    hold: 'value of one share against holding half the value in each token, bought at the start of the view; the dashed lines are holding only one of the two',
    marked: 'value of one share against a 50/50 mix kept at 50/50; equals the share price with the loss not yet booked in the current range added, as if it re-centred now',
    booked: 'the vault’s own share price (in liquidity units, which book the range loss only at rebalances; the parked vault’s is in ' + g.sym0 + ')',
    t0: 'value of one share in ' + g.sym0, t1: 'value of one share in ' + g.sym1,
  };
  $('perf-hint').innerHTML = H[st.measure] + ' &middot; change from the start of the view';
}

// ---------------------------------------------------------------------------------------- income and cost
function econSeries(a, t0, key) {
  const sp = M.span(a, t0, Infinity); if (!sp) return [];
  const tA = a.t[sp[0]];
  const pts = [{ t: tA, y: 0 }];
  if (key === 'lend') { if (!a.lend) return []; const b = a.lend[sp[0]]; for (let i = sp[0] + 1; i < a.t.length; i++) pts.push({ t: a.t[i], y: a.lend[i] - b }); return pts; }
  const val = e => key === 'net' ? e.net : key === 'aero' ? e.aero : key === 'fee' ? e.fee : (e.kind === 'h' ? 0 : e.cost);
  // events step the line; for the parked vault the net also takes lending between samples
  const marks = a.ev.filter(e => e.ts > tA).map(e => ({ t: e.ts, d: val(e) || 0, step: true }));
  if (key === 'net' && a.lend) for (let i = sp[0] + 1; i < a.t.length; i++) marks.push({ t: a.t[i], d: a.lend[i] - a.lend[i - 1] });
  marks.sort((x, y) => x.t - y.t);
  let acc = 0;
  for (const m of marks) { if (m.step) pts.push({ t: m.t, y: acc }); acc += m.d; pts.push({ t: m.t, y: acc }); }
  pts.push({ t: a.t[a.t.length - 1], y: acc });
  return pts;
}
function trendFit(pts, t0, t1) {
  let sxy = 0, sxx = 0, n = 0; const base = pts.length ? pts[0].y : 0, o = pts.length ? pts[0].t : t0;
  pts.forEach(p => { if (p.t >= o && p.t <= t1) { const dx = p.t - o, dy = p.y - base; sxy += dx * dy; sxx += dx * dx; n++; } });
  if (!n || !(sxx > 0)) return null;
  const slope = sxy / sxx; return { o, base, at: x => base + slope * (x - o), apr: slope * 365 * DAY };
}
function renderEcon(g) {
  const host = $('econ-chart'), leg = $('econ-legend');
  const [t0, t1] = windowNow();
  const key = st.econ;
  const series = g.arms.map(a => { const pts = econSeries(a, t0, key); return { a, pts, ts: pts.map(p => p.t) }; });
  const anySplit = g.arms.some(a => a.ev.some(e => e.aero != null));
  if ((key === 'aero' || key === 'fee') && !anySplit) { host.innerHTML = '<div class="empty">The AERO and swap-fee split is still being read for these events.</div>'; leg.innerHTML = ''; return; }
  let lo = 0, hi = 0;
  series.forEach(s => s.pts.forEach(p => { if (p.t <= t1) { lo = Math.min(lo, p.y); hi = Math.max(hi, p.y); } }));
  if (hi - lo < 0.2) { hi += 0.1; lo -= 0.1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const dec = hi - lo < 0.5 ? 3 : hi - lo < 5 ? 2 : 1;
  const f = frame(host, t0, t1, lo, hi, { zeroLine: true, yfmt: v => (v > 0 ? '+' : '') + v.toFixed(dec) + '%' });
  const trends = series.map(s => s.pts.length > 2 ? trendFit(s.pts, t0, t1) : null);
  series.forEach((s, i) => {
    const c = cssv(s.a.color);
    drawLine(f, s.pts, c, { noGaps: key !== 'lend' });
    const tr = trends[i]; if (tr) f.svg.appendChild(mk('line', { x1: f.X(tr.o), y1: f.Y(tr.at(tr.o)), x2: f.X(t1), y2: f.Y(tr.at(t1)), stroke: c, 'stroke-width': 1.2, 'stroke-dasharray': '5 4', 'stroke-opacity': .7, 'clip-path': f.clip }));
  });
  interact(f, t => {
    let rows = '';
    series.forEach(s => { if (!s.pts.length || t < s.pts[0].t) return; const i = before(s.ts, t); rows += trow(cssv(s.a.color), s.a.name, pct(s.pts[Math.max(0, i)].y, 3)); });
    return rows;
  });
  leg.innerHTML = series.map((s, i) => { const tr = trends[i]; const last = s.pts.filter(p => p.t <= t1).pop(); return `<span style="--c:${cssv(s.a.color)}"><span class="sw"></span>${s.a.name}${last ? ' <span class="apr">' + pct(last.y) + (tr ? ' &middot; trend ' + aprTxt(tr.apr) : '') + '</span>' : key === 'lend' && !s.a.lend ? ' <span class="apr">does not lend</span>' : ''}</span>`; }).join('');
  const H = {
    net: 'every event’s effect on the share price, added up from the start of the view (and lending income for the parked vault)',
    aero: 'AERO sold or claimed, after the protocol fee, as % of the vault’s value at each event',
    fee: 'swap fees collected by the unstaked part of the position, as % of the vault’s value',
    lend: 'interest earned on what the parked vault lends on Aave, as % of its value',
    cost: 'what each rebalance cost: for centred vaults the range loss booked at re-centring plus the swap; for the edge and parked vaults the move’s own cost (swap fee and price impact)',
  };
  $('econ-hint').innerHTML = H[key] + ' &middot; dashed: straight-line trend from the start of the view, shown as a yearly rate';
}

// ---------------------------------------------------------------------------------------- events table
function renderTable(g) {
  const host = $('events-table');
  const [t0, t1] = windowNow();
  const rows = [];
  g.arms.forEach(a => a.ev.forEach(e => { if (e.ts >= t0 - 1 && e.ts <= t1 + 1) rows.push({ e, a }); }));
  rows.sort((x, y) => y.e.ts - x.e.ts);
  if (!rows.length) { host.innerHTML = '<div class="empty">No rebalances or harvests in this timeframe.</div>'; $('events-hint').textContent = ''; return; }
  const cell = (x, c) => x == null ? '<span class="mut">&ndash;</span>' : Math.abs(x) < 5e-6 ? '<span class="mut">0</span>' : `<span class="${c || (x >= 0 ? 'pos' : 'neg')}">${(x >= 0 ? '+' : '&minus;') + Math.abs(x).toFixed(Math.abs(x) < 0.001 ? 4 : 3)}%</span>`;
  const shown = rows.slice(0, 300);
  host.innerHTML = `<div class="etable"><table><thead><tr><th>Time (UTC)</th><th>Vault</th><th>What</th><th>AERO</th><th>Swap fees</th><th>Cost</th><th>Net</th></tr></thead><tbody>`
    + shown.map(({ e, a }) => `<tr><td class="mut">${utc(e.ts)}</td><td><span class="armdot" style="background:${cssv(a.color)}"></span>${a.name}</td><td>${KIND[e.kind] || e.kind}</td><td>${cell(e.aero, 'pos')}</td><td>${cell(e.fee, 'pos')}</td><td>${cell(e.cost, 'neg')}</td><td>${cell(e.net)}</td></tr>`).join('')
    + `</tbody></table></div>`;
  $('events-hint').innerHTML = `${rows.length} in this timeframe${rows.length > shown.length ? ', newest ' + shown.length + ' listed' : ''} &middot; % of the vault’s value at the event &middot; AERO + swap fees + cost = net`;
}

// ---------------------------------------------------------------------------------------- footer and theme
function renderFoot(g) {
  const v = st.view;
  $('foot').innerHTML = `
    <p><b>Samples.</b> Each vault is read once an hour on the hour (block by block from its start, from archive state) and at the latest block; rebalances and harvests are read at the exact block. Lines are solid where hourly samples exist and dashed across stretches still without them.</p>
    <p><b>vs holding 50/50</b> compares the value of one share (position, idle and lent tokens, at the pool price) with holding half its starting value in each token. <b>Marked</b> compares it with a 50/50 mix kept at 50/50. For a centred vault this is its <b>booked</b> share price, in liquidity units, plus the loss its current range has not yet booked: that loss is booked only when the vault re-centres, so a wide range that has not moved looks better booked than it is.</p>
    <p><b>Income</b> is AERO (net of the protocol fee; for the edge vault, what its sale paid in ${g ? g.sym0 : 'USDC'}) and swap fees collected; for the parked vault also lending interest. <b>Cost at a rebalance</b> is the rest of the event's change in share price. For centred vaults it holds the range loss booked at re-centring and the swap; for the edge and parked vaults, whose share price is not in centred liquidity units, it is the move's own cost at the price just before it, and their range loss shows in the marked line instead. Yearly rates are simple: the change times 365 over the days in view.</p>
    <p>Volatility is the standard deviation of 4-hour moves of the pool price in view, scaled to a day. Snapshot at block ${v.generatedAtBlock.toLocaleString('en-US')}; the page reloads its data when a newer one is ready. Data: <a href="/api/data" style="color:inherit">/api/data</a>.</p>`;
}
function applyTheme() { const r = document.documentElement; if (st.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', st.theme); const b = $('theme'); if (b) b.textContent = 'Theme: ' + st.theme; }
$('theme').onclick = () => { st.theme = st.theme === 'auto' ? 'light' : st.theme === 'light' ? 'dark' : 'auto'; applyTheme(); save(); if (st.view) renderAll(); };
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (st.theme === 'auto' && st.view) renderAll(); });

// ---------------------------------------------------------------------------------------- live reload
load(true);
setInterval(async () => {
  if (document.visibilityState !== 'visible' || !st.view) return;
  try { const m = await (await fetch('/api/meta', { cache: 'no-store' })).json(); if (m && m.block && m.block > st.view.generatedAtBlock) load(false); } catch (e) {}
}, 45000);
</script>
